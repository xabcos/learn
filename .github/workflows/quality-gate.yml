name: Quality Gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: learn_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d learn_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LEARN_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/learn_test_ci
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: make release-check
      - run: make integration-test
