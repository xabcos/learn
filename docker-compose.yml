# learn.xabcnews.com. Secrets come from .env next to this file (mode 0600), never from here.
services:
  learn:
    container_name: learn
    image: proxyxai/learn:rust
    pull_policy: always
    restart: always
    stop_grace_period: 15s
    depends_on:
      - learn-postgres
    ports:
      - "127.0.0.1:8794:8788"
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://postgres:${LEARN_DB_PASSWORD:-learn}@learn-postgres:5432/learn?sslmode=disable
      PUBLIC_BASE_URL: https://learn.xabcnews.com
      LEARN_TIMEZONE: Asia/Shanghai
      LEARN_WRITER: ${LEARN_WRITER:-true}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.zairouter.com}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gpt-6-astra}
      AI_IMAGE_MODEL: ${AI_IMAGE_MODEL:-gpt-image-2.5-flare}
      TMPFILE_BASE_URL: ${TMPFILE_BASE_URL:-https://dl.xabcnews.com}
      TMPFILE_API_KEY: ${TMPFILE_API_KEY}
    networks: [network]

  learn-postgres:
    container_name: learn-postgres
    image: postgres:18
    pull_policy: always
    restart: always
    environment:
      POSTGRES_DB: learn
      POSTGRES_PASSWORD: ${LEARN_DB_PASSWORD:-learn}
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [network]

volumes:
  postgres_data:

networks:
  network:
